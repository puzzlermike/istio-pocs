version: '3'

vars:
  SAMPLES_DIR: "{{.ROOT_DIR}}/samples"

tasks:
  helloworld-all:
    cmds:
    - task: deploy
      vars:
        CONTEXT: kind-ecom-cloud
        DIR: "{{.SAMPLES_DIR}}/helloworld"
    - task: deploy
      vars:
        CONTEXT: kind-ecom-onprem
        DIR: "{{.SAMPLES_DIR}}/helloworld"

  curl-all:
    cmds:
    - task: deploy
      vars:
        CONTEXT: kind-ecom-cloud
        DIR: "{{.SAMPLES_DIR}}/curl"
    - task: deploy
      vars:
        CONTEXT: kind-ecom-onprem
        DIR: "{{.SAMPLES_DIR}}/curl"

  deploy:
    internal: true
    requires:
      vars: [CONTEXT, DIR]
    cmds:
    - kustomize build {{.DIR}} | kubectl apply --context {{.CONTEXT}} -f -
