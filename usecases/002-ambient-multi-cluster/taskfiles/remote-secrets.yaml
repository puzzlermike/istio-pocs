version: '3'

vars:
  READER_SA: istio-reader-service-account
  READER_TOKEN_SECRET: istio-reader-service-account-istio-remote-secret-token

tasks:
  create-remote-secrets-all:
    cmds:
    - task: create-remote-secret-ecom-cloud
    - task: create-remote-secret-ecom-onprem

  delete-remote-secrets-all:
    cmds:
    - task: delete-remote-secret-ecom-cloud
    - task: delete-remote-secret-ecom-onprem

  create-remote-secret-ecom-cloud:
    cmds:
    - task: create-remote-secret
      vars:
        SOURCE_CONTEXT: kind-ecom-onprem
        TARGET_CONTEXT: kind-ecom-cloud
        NAME: ecom-onprem
        NODE: ecom-onprem-control-plane

  create-remote-secret-ecom-onprem:
    cmds:
    - task: create-remote-secret
      vars:
        SOURCE_CONTEXT: kind-ecom-cloud
        TARGET_CONTEXT: kind-ecom-onprem
        NAME: ecom-cloud
        NODE: ecom-cloud-control-plane

  delete-remote-secret-ecom-cloud:
    cmds:
    - task: delete-remote-secret
      vars:
        SOURCE_CONTEXT: kind-ecom-onprem
        TARGET_CONTEXT: kind-ecom-cloud
        NAME: ecom-onprem

  delete-remote-secret-ecom-onprem:
    cmds:
    - task: delete-remote-secret
      vars:
        SOURCE_CONTEXT: kind-ecom-cloud
        TARGET_CONTEXT: kind-ecom-onprem
        NAME: ecom-cloud

  create-remote-secret:
    internal: true
    requires:
      vars: [SOURCE_CONTEXT, TARGET_CONTEXT, NAME, NODE]
    vars:
      NODE_IP:
        sh: docker inspect {{.NODE}} | jq -r '.[0].NetworkSettings.Networks.kind.IPAddress'
    cmds:
    - |
      set -e
      kubectl apply --context {{.SOURCE_CONTEXT}} -f - <<EOF
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{.READER_TOKEN_SECRET}}
        namespace: istio-system
        annotations:
          kubernetes.io/service-account.name: {{.READER_SA}}
      type: kubernetes.io/service-account-token
      EOF

      TOKEN=""
      for i in $(seq 1 30); do
        TOKEN=$(kubectl get secret {{.READER_TOKEN_SECRET}} -n istio-system --context {{.SOURCE_CONTEXT}} -o jsonpath='{.data.token}' | base64 --decode)
        [ -n "$TOKEN" ] && break
        sleep 1
      done
      [ -n "$TOKEN" ] || { echo "token for {{.READER_SA}} was not populated" >&2; exit 1; }
      CA=$(kubectl get secret {{.READER_TOKEN_SECRET}} -n istio-system --context {{.SOURCE_CONTEXT}} -o jsonpath='{.data.ca\.crt}')

      KUBECONFIG_FILE=$(mktemp)
      trap 'rm -f "$KUBECONFIG_FILE"' EXIT
      cat > "$KUBECONFIG_FILE" <<EOF
      apiVersion: v1
      kind: Config
      clusters:
      - name: {{.NAME}}
        cluster:
          certificate-authority-data: $CA
          server: https://{{.NODE_IP}}:6443
      users:
      - name: {{.NAME}}
        user:
          token: $TOKEN
      contexts:
      - name: {{.NAME}}
        context:
          cluster: {{.NAME}}
          user: {{.NAME}}
      current-context: {{.NAME}}
      EOF

      kubectl create secret generic istio-remote-secret-{{.NAME}} \
        --namespace istio-system \
        --from-file={{.NAME}}="$KUBECONFIG_FILE" \
        --dry-run=client -o yaml \
        | kubectl label --local -f - istio/multiCluster=true -o yaml \
        | kubectl annotate --local -f - networking.istio.io/cluster={{.NAME}} -o yaml \
        | kubectl apply --context {{.TARGET_CONTEXT}} -f -

  delete-remote-secret:
    internal: true
    requires:
      vars: [SOURCE_CONTEXT, TARGET_CONTEXT, NAME]
    cmds:
    - kubectl delete secret istio-remote-secret-{{.NAME}} -n istio-system --ignore-not-found --context {{.TARGET_CONTEXT}}
    - kubectl delete secret {{.READER_TOKEN_SECRET}} -n istio-system --ignore-not-found --context {{.SOURCE_CONTEXT}}
