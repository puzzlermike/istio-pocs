version: '3.0'

vars:
  GATEWAY_API_VERSION: v1.7.0
  GATEWAY_API_URL: https://github.com/kubernetes-sigs/gateway-api/releases/download/{{.GATEWAY_API_VERSION}}/experimental-install.yaml
  ISTIO_BASE_DIR: "{{.ROOT_DIR}}/istio/istio-base"

tasks:
  install-gateway-api-all:
    cmds:
    - task: install-gateway-api-ecom-cloud
    - task: install-gateway-api-ecom-onprem

  delete-gateway-api-all:
    cmds:
    - task: delete-gateway-api-ecom-cloud
    - task: delete-gateway-api-ecom-onprem

  install-istio-base-all:
    cmds:
    - task: install-istio-base-ecom-cloud
    - task: install-istio-base-ecom-onprem

  install-gateway-api-ecom-cloud:
    cmds:
    - task: install-gateway-api
      vars:
        CONTEXT: kind-ecom-cloud

  install-gateway-api-ecom-onprem:
    cmds:
    - task: install-gateway-api
      vars:
        CONTEXT: kind-ecom-onprem

  delete-gateway-api-ecom-cloud:
    cmds:
    - task: delete-gateway-api
      vars:
        CONTEXT: kind-ecom-cloud

  delete-gateway-api-ecom-onprem:
    cmds:
    - task: delete-gateway-api
      vars:
        CONTEXT: kind-ecom-onprem

  install-istio-base-ecom-cloud:
    cmds:
    - task: install-istio-base
      vars:
        CONTEXT: kind-ecom-cloud

  install-istio-base-ecom-onprem:
    cmds:
    - task: install-istio-base
      vars:
        CONTEXT: kind-ecom-onprem

  install-gateway-api:
    internal: true
    requires:
      vars: [CONTEXT]
    cmds:
    - kubectl apply --server-side --context {{.CONTEXT}} -f {{.GATEWAY_API_URL}}
    status:
    - kubectl get crd gatewayclasses.gateway.networking.k8s.io --context {{.CONTEXT}}

  delete-gateway-api:
    internal: true
    requires:
      vars: [CONTEXT]
    cmds:
    - kubectl delete --ignore-not-found --context {{.CONTEXT}} -f {{.GATEWAY_API_URL}}
    status:
    - '! kubectl get crd gatewayclasses.gateway.networking.k8s.io --context {{.CONTEXT}}'

  install-istio-base:
    internal: true
    requires:
      vars: [CONTEXT]
    cmds:
    - kustomize build --enable-helm {{.ISTIO_BASE_DIR}} | kubectl apply --server-side --context {{.CONTEXT}} -f -
    status:
    - kubectl get crd wasmplugins.extensions.istio.io --context {{.CONTEXT}}
