apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: flaky
  namespace: flaky
spec:
  host: flaky.flaky.svc.cluster.local
  trafficPolicy:
    outlierDetection:
      consecutive5xxErrors: 1
      interval: 1s
      baseEjectionTime: 1m
      maxEjectionPercent: 100
    loadBalancer:
      localityLbSetting:
        enabled: true
        failoverPriority:
        - topology.istio.io/cluster
