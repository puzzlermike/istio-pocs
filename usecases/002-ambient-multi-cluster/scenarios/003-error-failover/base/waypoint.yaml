apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: flaky
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  infrastructure:
    labels:
      istio.io/global: "true"
  listeners:
  - name: mesh
    port: 15008
    protocol: HBONE
