apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-eastwestgateway-options
  namespace: istio-system
data:
  service: |
    spec:
      type: NodePort
      ports:
      - port: 15008
        nodePort: 15008
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: istio-eastwestgateway
  namespace: istio-system
  labels:
    topology.istio.io/network: ecom-cloud
spec:
  gatewayClassName: istio-east-west
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: istio-eastwestgateway-options
  addresses:
  - type: IPAddress
    value: __NODE_IP__
  listeners:
  - name: mesh
    port: 15008
    protocol: HBONE
    tls:
      mode: Terminate
      options:
        gateway.istio.io/tls-terminate-mode: ISTIO_MUTUAL
